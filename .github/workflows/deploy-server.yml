name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/deploy-server.yml"

  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy-server-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify server
        run: |
          pnpm --filter @metro-nomedeul/shared build
          pnpm --filter @metro-nomedeul/server prisma:generate
          pnpm --filter @metro-nomedeul/server exec tsc --noEmit
          pnpm --filter @metro-nomedeul/server run test --runInBand
          pnpm --filter @metro-nomedeul/server build
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd ~/metro-nomedeul
            git pull --ff-only origin main
            [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "Refusing to deploy an unverified revision"; exit 1; }
            cd ~
            docker compose up -d --build metronomdeul-server
            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://localhost:3000/health >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            [ "$healthy" = true ] || exit 1
            echo "Deploy successful!"
